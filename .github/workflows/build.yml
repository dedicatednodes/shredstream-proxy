# Every push to master publishes an image, so there is always something current
# to pull between tagged releases. Pull requests build without pushing, which is
# what makes this a check rather than a publish.
#
# The workflow this replaces ran ONLY on pull_request and asked for a runner
# label of Jito's, so on our repository it ran never and would not have started
# if it had.
name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Read into env so a step-level `if` can test it: the secrets context
  # is not dependably available there, and a missing secret has to SKIP
  # the Docker Hub steps rather than fail the build.
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}

jobs:
  image:
    runs-on: ubuntu-latest
    # The tags below are literal, so a dispatch from any other ref would publish
    # that tree as :master. Refuse instead of mislabelling.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'master'
    steps:
      - uses: actions/checkout@v4

      # Runs here rather than in test.yml, which triggers on pull_request only
      # and has therefore never executed on this repository. A check that does
      # not run is not a check.
      - name: Check the commands the docs publish
        run: ./scripts/check-doc-commands.sh

      - uses: docker/setup-buildx-action@v3

      # NOT `== 'push'`. That gate made the run button useless: a dispatch skipped
      # the login, skipped the push, and reported green, which is the worst
      # possible answer to "why is there no image".
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # DOCKER HUB, at Tamur's request on 2026-09-17. Two registries carrying the
      # same image under the same path, so a customer following either link
      # lands on the same thing.
      #
      # IT SKIPS RATHER THAN FAILS when the secrets are absent. Without the
      # `if`, every build on a repository that has not been given Docker Hub
      # credentials goes red on a login step, which reads as a broken build
      # rather than as a missing secret. That is exactly how this repository
      # arrived: the workflows it was forked with pushed to Docker Hub with
      # secrets that were never set here.
      - name: Log in to Docker Hub
        id: hub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:master
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.hub.outcome == 'success' && format('docker.io/{0}:master', github.repository) || '' }}
            ${{ steps.hub.outcome == 'success' && format('docker.io/{0}:{1}', github.repository, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
