[workspace]
members = ["examples", "jito_protos", "proxy"]
resolver = "2"

[workspace.package]
version = "0.2.13"
description = "Receives Solana shreds from LocalShred Lite and forwards them to local consumers."
authors = ["DedicatedNodes"]
homepage = "https://dedicatednodes.io/"
edition = "2021"

[workspace.dependencies]
ahash = "0.8"
arc-swap = "1.6"
bincode = "1.3.3"
borsh = "1.5.3"
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5.8"
dashmap = "5"
env_logger = "0.11"
hostname = "0.4.0"
itertools = "0.14.0"
jito-protos = { path = "jito_protos" }
log = "0.4"
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = "0.5"
solana-client = "=2.2.1"
solana-entry = "=2.2.1"
# Pinned to a revision rather than to a branch. The branch this came from,
# eric/v2.2-merkle-recovery, no longer exists upstream, so a branch pin
# resolves only while Cargo.lock supplies the commit: regenerating the lock,
# or any cargo update, would fail to find the branch and break every build at
# once. Pinning the revision puts the commit in the manifest, where it does
# not depend on the lock surviving.
solana-ledger = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "cafa3ba4d4c6c3702d13545d9b434861ebc06036" }
solana-metrics = "=2.2.1"
solana-net-utils = "=2.2.1"
solana-perf = "=2.2.1"
solana-sdk = "=2.2.1"
solana-streamer = "=2.2.1"
thiserror = "2"
tokio = "1"
tonic = { version = "0.13", features = ["tls-webpki-roots"] }
tonic-build = "0.13"

[profile.release]
# thin has minimal overhead vs none (default): https://blog.llvm.org/2016/06/thinlto-scalable-and-incremental-lto.html
lto = "thin"
